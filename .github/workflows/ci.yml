name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        node: ['20', '22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm vitest run
      # tsdown 0.22 requires Node ^22.18 / >=24.11 (Promise.withResolvers in its
      # Node-20 config fallback path); typecheck+tests still run on 20 to keep
      # the runtime-compat signal.
      - if: ${{ matrix.node != '20' }}
        run: pnpm run build
      - if: ${{ matrix.node != '20' }}
        name: pack hygiene
        run: npm pack --dry-run
