<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>petween stage</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    .pet { position: absolute; left: 0; top: 0; width: 256px; height: 256px; background-size: 3072px 256px;
           transform-origin: 128px 256px; will-change: transform; }
    .bubble { position: absolute; left: 0; top: 0; padding: 6px 10px; border-radius: 10px; font: 13px/1.3 system-ui, sans-serif;
              background: #f4f1ec; color: #3c3446; box-shadow: 0 2px 8px #0003; white-space: nowrap; transition: opacity .4s; }
    #badges { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; }
    #badges span { padding: 3px 8px; border-radius: 8px; font: 12px system-ui, sans-serif; background: #3c3446cc; color: #f4f1ec; }
  </style>
</head>
<body>
  <div id="badges"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
